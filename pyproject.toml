[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polmap"
version = "0.1.0"
description = "国勢調査2020の市区町村別データから社会構造の軸を作り、地図に可視化するパイプライン"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "shapely>=2.0",
  "topojson>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
polmap = "polmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
