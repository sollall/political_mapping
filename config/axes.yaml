# 軸定義（仕様書 第5章・第6章）— Democracy 4 の有権者グループを参考にした16軸
#
# 統計表ID（statsDataId）とカテゴリーコードは未確認。e-Stat の getMetaInfo で確認し、
# 「TBD」で始まる値をすべて置き換えてから polmap run を実行する。
# polmap check で未記入の箇所を一覧できる。

tables:
  TBD_age:            {year: 2020, title: 年齢（各歳・5歳階級）別人口 - 市区町村}
  TBD_nationality:    {year: 2020, title: 国籍別人口 - 市区町村}
  TBD_households:     {year: 2020, title: 世帯の家族類型別一般世帯数（18歳未満世帯員の有無・三世代世帯を含む） - 市区町村}
  TBD_industry:       {year: 2020, title: 産業（大分類）別就業者数 - 市区町村}
  TBD_status:         {year: 2020, title: 従業上の地位別就業者数 - 市区町村}
  TBD_occupation:     {year: 2020, title: 職業（大分類）別就業者数 - 市区町村}
  TBD_workplace:      {year: 2020, title: 従業地別就業者数 - 市区町村}
  TBD_transport:      {year: 2020, title: 利用交通手段別通勤・通学者数 - 市区町村}

axes:
  # ---------------------------------------------------------------- 国勢調査でそのまま測れる軸
  - axis_id: retired_aged65
    name: 若い ↔ 高齢
    group: 高齢者
    formula: ratio
    stats_data_id: TBD_age
    numerator:   {cat01: ["TBD:65歳以上"]}
    denominator: {cat01: ["TBD:0〜14歳", "TBD:15〜64歳", "TBD:65歳以上"]}
    unknown:     {cat01: ["TBD:年齢不詳"]}
    small_area: true

  - axis_id: young_aged20_34
    name: 中高年 ↔ 若年
    group: 若者
    formula: ratio
    stats_data_id: TBD_age
    numerator:   {cat01: ["TBD:20〜24歳", "TBD:25〜29歳", "TBD:30〜34歳"]}
    denominator: {cat01: ["TBD:20歳以上の各階級"]}
    unknown:     {cat01: ["TBD:年齢不詳"]}
    small_area: true
    known_bias: 大学のある市区町村で高く出る

  - axis_id: parents_with_children
    name: 子どもなし ↔ 子育て世帯
    group: 親
    formula: ratio
    stats_data_id: TBD_households
    numerator:   {cat01: ["TBD:18歳未満世帯員のいる一般世帯"]}
    denominator: {cat01: ["TBD:一般世帯総数"]}
    known_bias: 施設等の世帯は含まない

  - axis_id: farmers_primary
    name: 非農林漁業 ↔ 農林漁業
    group: 農家
    formula: ratio
    stats_data_id: TBD_industry
    numerator:   {cat01: ["TBD:A農業・林業", "TBD:B漁業"]}
    denominator: {cat01: ["TBD:分類不能を除く全産業"]}
    unknown:     {cat01: ["TBD:分類不能の産業"]}
    known_bias: 主な仕事が別の産業の兼業農家は含まれない

  - axis_id: selfemployed_share
    name: 雇われ ↔ 自営
    group: 自営業者
    formula: ratio
    stats_data_id: TBD_status
    numerator:   {cat01: ["TBD:自営業主", "TBD:家族従業者"]}
    denominator: {cat01: ["TBD:従業上の地位不詳を除く全区分"]}
    unknown:     {cat01: ["TBD:従業上の地位不詳"]}
    known_bias: 農家の自営と重なる

  - axis_id: stateemployees_public
    name: 民間 ↔ 公務
    group: 公務員
    formula: ratio
    stats_data_id: TBD_industry
    numerator:   {cat01: ["TBD:S公務（他に分類されるものを除く）"]}
    denominator: {cat01: ["TBD:分類不能を除く全産業"]}
    unknown:     {cat01: ["TBD:分類不能の産業"]}
    known_bias: 公立の学校・病院の職員は教育・医療に分類され含まれない

  - axis_id: commuters_outside
    name: 地元で従業 ↔ 他市区町村へ通勤
    group: 通勤者
    formula: ratio
    stats_data_id: TBD_workplace
    numerator:   {cat01: ["TBD:他市区町村で従業"]}
    denominator: {cat01: ["TBD:自市区町村で従業", "TBD:他市区町村で従業"]}
    unknown:     {cat01: ["TBD:従業地不詳"]}
    known_bias: 2020年はコロナ禍の影響あり。政令市の区は同じ市の他区への通勤の扱いを要確認

  - axis_id: motorists_car_commute
    name: 自動車以外 ↔ 自動車通勤
    group: 自動車利用者
    formula: ratio
    stats_data_id: TBD_transport
    numerator:   {cat01: ["TBD:自家用車のみ"]}
    denominator: {cat01: ["TBD:利用交通手段不詳を除く総数"]}
    unknown:     {cat01: ["TBD:利用交通手段不詳"]}
    known_bias: 市区町村別の公表有無を要確認。通学者を含む。2025年簡易調査では更新できない
    updatable_2025: false

  - axis_id: minorities_foreign
    name: 日本人 ↔ 外国人
    group: 少数民族
    formula: ratio
    stats_data_id: TBD_nationality
    numerator:   {cat01: ["TBD:外国人"]}
    denominator: {cat01: ["TBD:日本人", "TBD:外国人"]}
    unknown:     {cat01: ["TBD:国籍不詳"]}
    small_area: true
    known_bias: 外国にルーツのある日本国籍者は含まれない

  # ---------------------------------------------------------------- 代理指標（解釈が入る）
  - axis_id: wealthy_managers
    name: 管理職が少ない ↔ 管理職が多い
    group: 富裕層
    formula: ratio
    stats_data_id: TBD_occupation
    numerator:   {cat01: ["TBD:A管理的職業従事者"]}
    denominator: {cat01: ["TBD:分類不能を除く全職業"]}
    unknown:     {cat01: ["TBD:分類不能の職業"]}
    known_bias: 代理指標。所得そのものではない

  - axis_id: poor_nonregular
    name: 正規中心 ↔ 非正規中心
    group: 貧困層
    formula: ratio
    stats_data_id: TBD_status
    numerator:   {cat01: ["TBD:労働者派遣事業所の派遣社員", "TBD:パート・アルバイト・その他"]}
    denominator: {cat01: ["TBD:正規の職員・従業員", "TBD:労働者派遣事業所の派遣社員", "TBD:パート・アルバイト・その他"]}
    known_bias: 代理指標。学生や家計補助のパートを含む

  - axis_id: middle_regular
    name: 正規雇用が少ない ↔ 正規雇用が多い
    group: 中間所得層
    formula: ratio
    stats_data_id: TBD_status
    numerator:   {cat01: ["TBD:正規の職員・従業員"]}
    denominator: {cat01: ["TBD:従業上の地位不詳を除く全区分"]}
    unknown:     {cat01: ["TBD:従業上の地位不詳"]}
    known_bias: 代理指標。poor_nonregular と強く逆相関する

  - axis_id: capitalists_executives
    name: 役員が少ない ↔ 役員が多い
    group: 資本家
    formula: ratio
    stats_data_id: TBD_status
    numerator:   {cat01: ["TBD:役員"]}
    denominator: {cat01: ["TBD:従業上の地位不詳を除く全区分"]}
    unknown:     {cat01: ["TBD:従業上の地位不詳"]}
    known_bias: 代理指標。会社の所在地ではなく住所で数える

  - axis_id: unionists_manufacturing
    name: 非製造業 ↔ 製造業
    group: 労働組合員
    formula: ratio
    stats_data_id: TBD_industry
    numerator:   {cat01: ["TBD:E製造業"]}
    denominator: {cat01: ["TBD:分類不能を除く全産業"]}
    unknown:     {cat01: ["TBD:分類不能の産業"]}
    known_bias: 代理指標。組合加入率ではない

  - axis_id: conservatives_three_generation
    name: 核家族・単身 ↔ 三世代同居
    group: 保守
    formula: ratio
    stats_data_id: TBD_households
    numerator:   {cat01: ["TBD:三世代世帯"]}
    denominator: {cat01: ["TBD:一般世帯総数"]}
    known_bias: 代理指標。価値観ではなく世帯構成

  - axis_id: liberals_single
    name: 家族世帯 ↔ 単独世帯
    group: リベラル
    formula: ratio
    stats_data_id: TBD_households
    numerator:   {cat01: ["TBD:単独世帯"]}
    denominator: {cat01: ["TBD:家族類型不詳を除く一般世帯"]}
    unknown:     {cat01: ["TBD:家族類型不詳"]}
    small_area: true
    known_bias: 代理指標。学生や高齢の単身者を含む

# 対象外（国勢調査では測れない）: 社会主義者・宗教信者・環境保護主義者・愛国者
