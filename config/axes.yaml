# 軸定義（仕様書 第5章・第6章）
#
# tables: 使う統計表（e-Stat の statsDataId）と調査年
# axes:   1軸＝1概念。分子・分母はカテゴリーコードの和で書く
#
# 統計表IDとカテゴリーコードは e-Stat の getMetaInfo で確認してから記入すること。
# 軸の書き方は config/demo/axes.yaml（合成データ用）も参考になる。

